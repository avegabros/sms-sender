version: '3.8'

services:
  sms-sender:
    build: .
    container_name: sms-sender
    ports:
      - "8080:8000"
    devices:
      # Map the Raspberry Pi physical UART serial port to the container
      - "/dev/ttyAMA0:/dev/ttyAMA0"
    security_opt:
      # Some Linux systems require raw peripheral access flags
      - apparmor:unconfined
    environment:
      - SMS_SENDER_API_KEY=${SMS_SENDER_API_KEY:-}
      - DASHBOARD_USERNAME=${DASHBOARD_USERNAME:-}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-}
      - RESET_GPIO_PIN=${RESET_GPIO_PIN:-17}
    volumes:
      - ./data:/app/data
      # Map sysfs GPIO interface for hardware pin resets (if wired)
      - /sys/class/gpio:/sys/class/gpio
    restart: always




