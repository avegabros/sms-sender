version: '3.8'

services:
  sms-sender:
    build: .
    container_name: sms-sender
    ports:
      - "8080:8000"
    devices:
      # Map the Raspberry Pi physical UART serial port to the container
      - "/dev/ttyAMA0:/dev/ttyAMA0"
    security_opt:
      # Some Linux systems require raw peripheral access flags
      - apparmor:unconfined
    environment:
      - SMS_SENDER_API_KEY=${SMS_SENDER_API_KEY:-}
      - DASHBOARD_USERNAME=${DASHBOARD_USERNAME:-}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-}
    volumes:
      - ./data:/app/data
    networks:
      - default
      - nginx-proxy-manager_default
    restart: always

networks:
  nginx-proxy-manager_default:
    external: true


